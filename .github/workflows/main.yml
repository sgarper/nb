name: Actualizar EPG

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta automáticamente todos los días a las 3:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Descargar y Fusionar XMLs
        run: python combinar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git commit -m "EPG actualizada automáticamente" || exit 0
          git push
